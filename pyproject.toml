[project]
name = "dndllm26"
version = "0.3.0"
description = "Hardened local-first LLM D&D web application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.3,<0.53",
    "sqlmodel>=0.0.39,<0.1",
    "pydantic-settings>=2.14.1,<3",
    "ollama>=0.6.2,<0.7",
    "lancedb>=0.37.1,<0.38",
    "pypdf>=6.16.1,<7",
    "python-multipart>=0.0.32,<0.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.0.2,<10",
    "ruff>=0.16.3,<0.17",
]

[project.scripts]
dndllm26-api = "dndllm26.main:run"
dndllm26-integrity = "dndllm26.db.integrity:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dndllm26"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires optional local infrastructure such as Ollama",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest-cov>=7,<8",
]

name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python }}
          require-checksums: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff format --check backend
      - run: uv run --locked --extra dev ruff check backend
      - run: uv run --locked --extra dev pytest --cov=backend/dndllm26 --cov-fail-under=67
      - if: runner.os == 'Linux'
        run: uv audit --locked
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - run: bun install --cwd frontend --frozen-lockfile
      - run: bun test scripts
      - run: bun run --cwd frontend check
      - run: bun run check:bundle
      - run: bun audit
        working-directory: frontend
